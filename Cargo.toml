[workspace]
members = [
    "crates/cli",
    "crates/runtime",
    "crates/providers",
    "crates/tools",
    "crates/memory",
    "crates/config",
    "crates/shared"
]

resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

anyhow = "1"
thiserror = "1"

async-trait = "0.1"

reqwest = { version = "0.12", features = ["json", "stream"] }

futures = "0.3"

tracing = "0.1"
tracing-subscriber = "0.3"